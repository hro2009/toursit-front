<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Hayq Admin</title>
  <script>
    const base = document.createElement('base');
    base.href = location.hostname === 'hro2009.github.io' ? '/toursit-front/' : '/';
    document.head.append(base);
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin/admin.css">
  <script src="config.js"></script>
  <script type="module" src="admin/admin.js"></script>
</head>
<body>
  <main class="login" id="loginView">
    <a class="brand" href="./">Հայք <span>ADMIN</span></a>
    <h1>Sign in</h1>
    <form id="loginForm">
      <label>Email<input name="email" type="email" autocomplete="username" required maxlength="254"></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="primary" type="submit">Sign in</button>
      <p class="notice" id="loginStatus" role="status"></p>
    </form>
  </main>

  <div class="app" id="adminView" hidden>
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="./">Հայք <span>ADMIN</span></a>
      <nav id="adminNav" aria-label="Admin sections">
        <button data-view="dashboard" class="active">Dashboard</button>
        <button data-view="tours">Tours</button>
        <button data-view="bookings">Bookings</button>
        <button data-view="requests">Requests</button>
        <button data-view="reviews">Reviews</button>
        <button data-view="addons">Add-ons</button>
        <button data-view="services">Services</button>
        <button data-view="settings">Settings</button>
        <button data-view="users" data-owner-only hidden>Users</button>
      </nav>
      <div class="side-foot"><span id="adminIdentity"></span><button class="quiet" id="logoutBtn">Log out</button></div>
    </aside>
    <main class="workspace">
      <header class="topbar"><button class="menu-toggle" id="menuToggle" aria-label="Open navigation">Menu</button><h1 id="viewTitle">Dashboard</h1><a href="./" target="_blank" rel="noopener">View site</a></header>
      <p class="notice" id="adminNotice" role="status"></p>
      <section id="viewRoot" aria-live="polite"></section>
    </main>
  </div>
</body>
</html>
